<!DOCTYPE html>
<html>
<head>
<style>
body {
  text-align: center;
  margin-top: 100px;
  font-family: Arial;
}

button {
  width: 50px;
  height: 50px;
  font-size: 20px;
  border: none;
  background: black;
  color: white;
  cursor: pointer;
  border-radius: 10px;
}

#number {
  font-size: 30px;
  margin: 0 20px;
}

#winner {
  margin-top: 20px;
  font-size: 25px;
  color: green;
}
</style>
</head>
<body>

<button onclick="minus()">-</button>
<span id="number">0</span>
<button onclick="plus()">+</button>

<div id="winner"></div>

<script>
let count = 0;

function plus() {
  if (count < 5) {
    count++;
  }
  update();
}

function minus() {
  if (count > 0) {
    count--;
  }
  update();
}

function update() {
  document.getElementById("number").textContent = count;

  if (count === 5) {
    document.getElementById("winner").textContent = "Winner";
  } else {
    document.getElementById("winner").textContent = "";
  }
}
</script>

</body>
</html>
